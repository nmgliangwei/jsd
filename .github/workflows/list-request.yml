name: 名单变更自动处理

on:
  issues:
    types: [labeled]

jobs:
  process-list-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check trigger
        id: check
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const label = context.payload.label.name;
            const body = context.payload.issue.body || '';
            // 必须是 approved 标签，且 body 包含名单变更模板关键字
            if (label === 'approved' && body.includes('名单类型')) {
              return 'yes';
            }
            return 'no';

      - uses: actions/checkout@v4
        if: steps.check.outputs.result == 'yes'

      - name: Parse issue and update config
        if: steps.check.outputs.result == 'yes'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          node scripts/process-list-request.js

      - name: Create Pull Request
        if: steps.check.outputs.result == 'yes'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "list: 名单变更 #${{ github.event.issue.number }}"
          body: |
            自动生成自 #${{ github.event.issue.number }}

            合并此 PR 即可使名单变更生效。
          branch: list-request-${{ github.event.issue.number }}
          commit-message: "chore(config): 名单变更 #${{ github.event.issue.number }}"
          labels: automated

      - name: Comment on issue
        if: steps.check.outputs.result == 'yes' && steps.cpr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.cpr.outputs.pull-request-number }};
            const prUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`;
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'pending-review'
              });
            } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 审核通过，配置已更新，PR 已自动创建：${prUrl}\n\n合并 PR 后变更即生效。`
            });
