name: 名单变更处理

on:
  issues:
    types: [opened, labeled]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      should_process: ${{ steps.decide.outputs.should_process }}
    steps:
      - uses: actions/github-script@v7
        id: decide
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const author = context.payload.issue.user.login;
            const body = context.payload.issue.body || '';
            const action = context.payload.action;
            const label = context.payload.label ? context.payload.label.name : '';

            // 只处理名单变更申请
            if (!body.includes('名单类型')) {
              core.setOutput('should_process', 'false');
              console.log('Not a list-request issue, skipping.');
              return;
            }

            // opened 事件：判断是否项目成员
            if (action === 'opened') {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issueNumber, labels: ['list-request']
              });

              let isCollaborator = false;
              try {
                const { status } = await github.rest.repos.checkCollaborator({
                  owner, repo, username: author
                });
                isCollaborator = status === 204;
              } catch (e) {
                isCollaborator = false;
              }

              if (isCollaborator) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber, labels: ['approved']
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: '✅ 项目成员提交，自动审核通过。'
                });
                core.setOutput('should_process', 'true');
              } else {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber, labels: ['pending-review']
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: '📋 申请已提交，等待管理员审核。审核通过后会自动创建配置变更 PR。'
                });
                core.setOutput('should_process', 'false');
              }
              return;
            }

            // labeled 事件：只有 approved 标签才处理
            if (action === 'labeled' && label === 'approved') {
              core.setOutput('should_process', 'true');
              return;
            }

            core.setOutput('should_process', 'false');

  process:
    needs: check
    if: needs.check.outputs.should_process == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse issue and update config
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          node scripts/process-list-request.js

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "list: 名单变更 #${{ github.event.issue.number }}"
          body: |
            自动生成自 #${{ github.event.issue.number }}

            合并此 PR 即可使名单变更生效。
          branch: list-request-${{ github.event.issue.number }}
          commit-message: "chore(config): 名单变更 #${{ github.event.issue.number }}"
          labels: automated

      - name: Comment on issue
        if: steps.cpr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.cpr.outputs.pull-request-number }};
            const prUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`;
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'pending-review'
              });
            } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 审核通过，配置已更新，PR 已自动创建：${prUrl}\n\n合并 PR 后变更即生效。`
            });
