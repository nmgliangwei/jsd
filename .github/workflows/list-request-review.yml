name: 名单变更审核标记

on:
  issues:
    types: [opened]

jobs:
  label-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const author = context.payload.issue.user.login;
            const labels = context.payload.issue.labels.map(l => l.name);

            // 只处理名单变更申请（来自 issue template 的标签）
            if (!labels.includes('list-request')) {
              console.log('Not a list-request issue, skipping.');
              return;
            }

            let isCollaborator = false;
            try {
              const { status } = await github.rest.repos.checkCollaborator({
                owner,
                repo,
                username: author
              });
              isCollaborator = status === 204;
            } catch (e) {
              isCollaborator = false;
            }

            if (isCollaborator) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['approved']
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: '✅ 项目成员提交，自动审核通过。'
              });
            } else {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['pending-review']
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: '📋 申请已提交，等待管理员审核。审核通过后会自动创建配置变更 PR。'
              });
            }
